# What has to be true of every push and every pull request.
#
# What this package has to get right is mostly what must *not* happen, and none
# of it can be checked by reading the code: that a token never reaches a log
# line, that a Bearer does not follow a redirect off the origin it was meant
# for, that a response running past its declared length is refused before it
# lands on disk, that bytes failing their hash reach no caller. Each one is
# answered by a scripted transport and a question about what went out. They are
# also the tests that stop being true quietly — a header masked by name still
# compiles when the name changes, just with somebody's token in it — so they run
# on every push.
#
# Portable builds use the same Swift tools version declared by the package.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege, named rather than inherited: these jobs read the tree and
# write nothing, and the default token would let them do more.
permissions:
  contents: read

# Actions are pinned to a major tag: patches and security fixes arrive without
# a commit here, and a major bump — which is the one that can break a build —
# still has to be made on purpose. A repository that wants the stricter form
# pins the full commit SHA instead, and then needs something like Dependabot to
# move it.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest Xcode on the runner
        run: Scripts/ci-select-xcode.sh
      # The Xcode build backend drops NIO test dependencies when RMCloud uses
      # the same products conditionally. The native backend preserves both.
      - run: swift build --build-system native --build-tests
      # Serial: in parallel the transport suites starve each other and the
      # run stops part-way, here as on Linux.
      - run: swift test --build-system native --no-parallel

  # The toolchain comes from the image rather than from an installer action:
  # in the sibling packages setup-swift answered "Version 6.3 is not available"
  # for every spelling we tried, while `swift:6.3` is the image the port was
  # verified in.
  portable:
    name: Build and test on Linux
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
      # Not root: the transport tests bind loopback listeners and the file
      # tests rely on a directory refusing a write, which root is never
      # refused.
      - run: |
          useradd -m builder
          chown -R builder "$(cd .. && pwd)"
          # Serial: in parallel, the transport suites starve each other and
          # the run stalls part-way through. It costs a second.
          su builder -c "cd '$GITHUB_WORKSPACE' && swift build && swift test --no-parallel"

  # Windows has no image to pull, and the generic installer could not resolve
  # the version; this one installs the release build from swift.org by its
  # branch and tag names, which is the same artefact a person would download.
  windows:
    name: Build and test on Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
      - run: swift build
      # Serial for the same reason as the other platforms.
      - run: swift test --no-parallel

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # A release pinned by number rather than whatever Homebrew has today:
      # `--strict` below turns every new rule a new SwiftLint ships into a red
      # build, and a build that goes red without a commit is a build nobody
      # can bisect. Bumping the number is a commit, reviewed like one.
      - name: Install SwiftLint 0.65.1
        run: |
          curl -sSL -o swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          unzip -q swiftlint.zip -d swiftlint-bin
      # `--strict` because the configuration beside it has no warnings left to
      # tolerate: every rule that fires on deliberate work is switched off by
      # name, with the measurement that justified it. A warning here is new.
      - run: swiftlint-bin/swiftlint lint --strict

  framework:
    name: Build the xcframework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use the newest Xcode on the runner
        run: Scripts/ci-select-xcode.sh
      - run: brew install xcodegen
      # The artefact a consumer links against, built the way a release is: the
      # script's own checks refuse a static framework and one missing a slice,
      # and both are failures that otherwise surface only in the consumer. The
      # one framework this links is RedactLog's public release, fetched by
      # `Scripts/fetch-redactlog.sh` and checked against `Scripts/RedactLog.pin`.
      - run: Scripts/build-xcframework.sh
