# SwiftLint for RMCloud. Run it from the repository root: `swiftlint`.
#
# What this configuration is for: the mechanical mistakes a reader stops
# noticing — a force unwrap that takes the whole run down with a signal,
# `count == 0` where `isEmpty` was meant, a `%` that means `isMultiple(of:)`.
# What it is deliberately not for is the shape of the code. Those decisions
# this package has already made and written down in the comments above each
# one, and a linter repeating them at every build teaches nothing that review
# does not.
#
# Every number below was measured against this tree, and every rule that is off
# is off for a reason given on the spot. Forty-two files of sources and eighteen
# of tests; twenty-three violations between five rules, all of them named here.
# The long files are the test suites, and they are long because an unofficial
# protocol is learned one case at a time.

excluded:
  - .build
  - .swiftpm
  - build
  - DerivedData
  # Generated by XcodeGen from project.yml for the framework build, and
  # ignored rather than committed. It holds no Swift of its own; it is named
  # here so a stray lint of a generated tree stays quiet.
  - RMCloud.xcodeproj

disabled_rules:
  # 6 occurrences, consistently, across Package.swift and the tests. That is
  # a house style, and the linter does not get a vote.
  - trailing_comma
  # Three test files: 954, 1178 and 518 lines. Each is one subject — what the
  # client does when the wire answers well, what it does when the wire answers
  # badly, and a real local server driven end to end — and each grows by cases
  # rather than by concerns, because that is how a reverse-engineered protocol is
  # learned. Split at a line count they would become files named after nothing.
  - file_length
  # One function, and the setup is the test: `TransportServerTests.swift:425`
  # stands up a server, drives a full exchange through it and takes it down
  # again, in 54 lines against a ceiling of 50.
  - function_body_length
  # Five places, all the same shape: a response body turned into text for a log
  # line or an error's detail. The rule prefers the failable initializer; here the
  # total one is wanted — bytes that are not valid UTF-8 still have to produce
  # something a person can read, and `nil` would drop the one clue a protocol
  # trace was opened for.
  - optional_data_string_conversion
  # One function: `CloudError.==`, complexity 15 against 10. It is a `switch`
  # with one branch per case of a seventeen-case enum, spelled out because the
  # synthesised witness is absent from a binary framework's symbol table (see
  # the comment above it). The branches are the enum's rather than the
  # function's, and there is no shorter way to compare two payloads.
  - cyclomatic_complexity

# The rest of the size-and-complexity family stays on, at its defaults, and every
# rule in it is at zero: `type_body_length`, `nesting` and
# `function_parameter_count`. Three of the six are off and three are not, which
# is the honest split: the sources trip one of the six, and that one is named
# above. Nothing in the client, the parser or the token exchange is near a
# ceiling, so the first one to fire there is new work and is looked at.

opt_in_rules:
  # Rules that are off by default and earn their place here: each one names a
  # spelling that hides intent — a count compared to zero, a filter whose only
  # use is `isEmpty`, a `%` that means `isMultiple(of:)`.
  #
  # None of these fires today. They are guards, not clean-up: the point is that
  # the first one to fire is new work, and is looked at.
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  # Zero force unwraps in the package today, product code and tests alike, and
  # that is the state worth keeping. Tests are not exempt: a `!` there ends the
  # whole run with a signal, so the case that failed is the one thing the
  # output does not name. The same reasoning retires `try?` over a `#require`
  # in a test that is not `throws`: it swallows the one error that would have
  # said which value was missing.
  - force_unwrapping
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unowned_variable_capture
  - yoda_condition

# Prose is exempt — the long explanations above declarations are the point of this
# package, and wrapping them to a column would only make them worse. What is left
# is code, and code at 240 columns is not read, it is scrolled past. The ceiling
# is 150: the longest line in the tree today is 137 columns, an index fixture
# spelled out in one line, so the number is a bound on what may be added rather
# than a description of what is there.
line_length:
  warning: 150
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

# `v3` and `v4` are the sync protocol's own names for its schema versions, and
# `to`, `at`, `me`, `n`, `a`, `b` are locals in tests — a redirect's target, a
# counter, the two sides of a comparison. Thirteen in all, and a longer name would
# say nothing the line does not already. The ceiling stays: a forty-character name
# is a different problem.
identifier_name:
  min_length: 1

# One place, in a test, and the third member is what the assertion is about. At
# four a tuple stops being readable and wants a name.
large_tuple:
  warning: 3
