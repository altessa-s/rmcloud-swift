# The framework wrapper, and nothing else.
#
# `Package.swift` beside this file is the real project: sources, tests, and what
# anyone developing the protocol builds. This file exists for one reason — SwiftPM
# cannot produce a `.framework`, and an `.xcframework` is what the application
# consumes. So the same sources are compiled once more, here, as a framework
# target, and `Scripts/build-xcframework.sh` wraps the result.
#
# Dynamic, like the frameworks beside it in a consumer: Xcode embeds a package's
# binary framework into the application bundle whatever it holds, and one copy
# shared through `Contents/Frameworks` is what keeps a type from existing twice in
# a process.
#
# `RMLog` is **linked and not embedded**, which is the whole point of this file. It
# is a framework the consuming application already carries; embedding a copy here
# would put two `LogSink` protocols in one process, and then a sink the host
# installed would never receive the lines this package writes — silently, at run
# time, with nothing in a build to say so. Linked instead, this framework records
# `@rpath/RMLog.framework` and finds the host's copy. The versions therefore have
# to agree: `ThirdParty/RMLog/RMLog.version` says which release the artefact came
# from.
#
# Generated project, not committed: run the script.
name: RMCloud

options:
  bundleIdPrefix: io.altessa
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # What makes the module readable by a later compiler than the one that built
    # it: the `.swiftinterface` beside the binary module.
    BUILD_LIBRARY_FOR_DISTRIBUTION: "YES"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULE_DEBUGGING: "NO"

targets:
  RMCloud:
    type: framework
    platform: macOS
    sources:
      - path: Sources/RMCloud
    dependencies:
      - framework: ThirdParty/RMLog/RMLog.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: RMCloud
        PRODUCT_MODULE_NAME: RMCloud
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "NO"
        INSTALL_PATH: /Library/Frameworks
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        # A framework without an `Info.plist` cannot be embedded in an
        # application bundle: Xcode's copy phase refuses it by name. Synthesised
        # rather than kept as a file, because there is nothing in it this
        # package has an opinion about.
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: io.altessa.rmcloud
        # What a local build calls itself; a release overrides it with the tag.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Both slices, always: the consumer's release build is universal, and
        # a framework with one of them fails the link rather than the build.
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: "NO"
